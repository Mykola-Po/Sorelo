name: CI

on:
  push:
    branches:
      - main
      - master
      - "codex/**"
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: publishable-key
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:54322/postgres
      INTERNAL_API_SECRET: internal-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:check
      - run: npm run test
      - name: Bootstrap local Supabase DB
        run: |
          test -f supabase/config.toml || supabase init
          supabase db start
      - run: npm run test:integration
      - run: npm run build
      - name: Start app for Inbox runtime check
        run: |
          npm run start -- --hostname 127.0.0.1 > "$RUNNER_TEMP/inbox-start.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/inbox-start.pid"
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/inbox-start.log"
          exit 1
      - name: Run Inbox runtime gate
        run: npm run ops:inbox:check -- --base-url http://127.0.0.1:3000
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright browser flows
        run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
